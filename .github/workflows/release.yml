name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for example v0.1.0
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: Build and push the image
    runs-on: waitformeet
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # The ARC runner is a node in the target cluster (amd64), so a native build
      # already matches the deployment arch. Add docker/setup-qemu-action and a
      # platforms list here only if you need to publish other arches.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Package and push the chart
    runs-on: waitformeet
    needs: image
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      # The chart and the image ship together, so their versions are kept in step
      # rather than drifting apart into a matrix nobody can reason about.
      - name: Stamp the chart version
        run: |
          helm package deploy/helm/waitformeet \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist

      - name: Log in to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push
        run: |
          helm push "dist/waitformeet-${{ steps.version.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
