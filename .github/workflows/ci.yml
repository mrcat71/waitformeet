name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  # setup-go's manifest can lag a newly released Go patch. Let Go select the
  # exact toolchain required by go.mod instead of failing while it catches up.
  GOTOOLCHAIN: "auto"
  # Pinned, not "latest": a new golangci-lint release enables new checks, which
  # would fail CI on an unchanged commit.
  GOLANGCI_VERSION: "v2.12.2"
  # esbuild strips TypeScript types without checking them, so a real compiler runs
  # separately. This is the only place Node appears anywhere in the project.
  TYPESCRIPT_VERSION: "6.0.3"

jobs:
  go:
    name: Go
    runs-on: waitformeet
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # setup-go leaves GOTOOLCHAIN=local in the job environment on this runner.
      # Write after setup-go so every later step uses the module's toolchain.
      - name: Enable automatic Go toolchain selection
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l -s .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # No -race: the cluster runner image ships no C compiler, so cgo is off and
      # the race detector cannot build. `make test` still runs it locally.
      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: go build ./...

  lint:
    name: golangci-lint
    runs-on: waitformeet
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # setup-go leaves GOTOOLCHAIN=local in the job environment on this runner.
      # Write after setup-go so every later step uses the module's toolchain.
      - name: Enable automatic Go toolchain selection
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}

  assets:
    name: Frontend
    runs-on: waitformeet
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # setup-go leaves GOTOOLCHAIN=local in the job environment on this runner.
      # Write after setup-go so every later step uses the module's toolchain.
      - name: Enable automatic Go toolchain selection
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Type-check the page script
        run: npx --yes --package=typescript@${{ env.TYPESCRIPT_VERSION }} tsc --noEmit -p tsconfig.json

      - name: Type-check the service worker
        run: npx --yes --package=typescript@${{ env.TYPESCRIPT_VERSION }} tsc --noEmit -p tsconfig.sw.json

      # The bundle is committed so that `go build` works on a fresh clone with no
      # JavaScript toolchain. This makes sure the committed copy matches the source.
      - name: Rebuild the bundle
        run: go run ./tools/assets

      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --exit-code -- internal/web/static/dist; then
            echo "The committed bundle is out of date. Run 'make assets' and commit the result."
            exit 1
          fi

  helm:
    name: Helm chart
    runs-on: waitformeet
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Lint
        run: helm lint deploy/helm/waitformeet

      # Several shapes, because a template that only renders with the defaults is a
      # template that breaks the first time somebody turns something on.
      - name: Render with the defaults
        run: helm template wfm deploy/helm/waitformeet

      - name: Render with ingress, OIDC, monitoring and a network policy
        run: |
          helm template wfm deploy/helm/waitformeet \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set 'ingress.tls[0].secretName=wfm-tls' \
            --set 'ingress.tls[0].hosts[0]=wait.example.com' \
            --set auth.oidc.enabled=true \
            --set auth.oidc.clientID=wfm \
            --set auth.oidc.clientSecret=shh \
            --set auth.bootstrap.email=me@example.com \
            --set metrics.serviceMonitor.enabled=true \
            --set networkPolicy.enabled=true

      - name: Render with an existing claim and an existing secret
        run: |
          helm template wfm deploy/helm/waitformeet \
            --set persistence.existingClaim=my-volume \
            --set existingSecret.name=my-secret

      - name: Render with the content pinned by the seed
        run: |
          helm template wfm deploy/helm/waitformeet \
            --set config.seedMode=always \
            --set content.siteTitle="Until we meet" \
            --set content.main.title=reunion \
            --set content.main.at=2026-12-24T10:00 \
            --set content.main.timezone=Asia/Shanghai

      # The schema is what stops a second replica from corrupting the database, so
      # its guards are worth testing rather than assuming.
      - name: The schema must refuse a second replica
        run: |
          if helm template wfm deploy/helm/waitformeet --set replicaCount=2 >/dev/null 2>&1; then
            echo "replicaCount=2 was accepted, but SQLite on a RWO volume cannot be scaled out"
            exit 1
          fi

      - name: The schema must refuse unrestricted auto-provisioning
        run: |
          if helm template wfm deploy/helm/waitformeet \
            --set auth.oidc.enabled=true \
            --set auth.oidc.clientID=wfm \
            --set auth.oidc.autoProvision=true >/dev/null 2>&1; then
            echo "auto-provisioning with no group or domain restriction was accepted"
            exit 1
          fi

  docker:
    name: Image
    runs-on: waitformeet
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only, no push. Pushing happens on a tag, in release.yml.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
