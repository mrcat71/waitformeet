{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "waitformeet.serviceAccountName" . }}
  labels:
    {{- include "waitformeet.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The site talks to nobody in the cluster, so it has no use for a token.
automountServiceAccountToken: false
{{- end }}
