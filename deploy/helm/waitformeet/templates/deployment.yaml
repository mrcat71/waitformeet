apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waitformeet.fullname" . }}
  labels:
    {{- include "waitformeet.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not RollingUpdate. The database is a single SQLite file on a
  # ReadWriteOnce volume, so the old pod has to let go before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "waitformeet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Rolls the pod whenever the configuration or the credentials change, which
        # a Deployment does not otherwise notice.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret.name }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "waitformeet.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "waitformeet.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: waitformeet
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "waitformeet.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: WFM_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "waitformeet.secretName" . }}
                  key: {{ .Values.existingSecret.keys.sessionSecret }}
            {{- if .Values.auth.bootstrap.email }}
            - name: WFM_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "waitformeet.secretName" . }}
                  key: {{ .Values.existingSecret.keys.bootstrapPassword }}
                  optional: true
            {{- end }}
            {{- if .Values.auth.oidc.enabled }}
            - name: WFM_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "waitformeet.secretName" . }}
                  key: {{ .Values.existingSecret.keys.oidcClientSecret }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: seed
              mountPath: /etc/waitformeet
              readOnly: true
            # The root filesystem is read-only, so the places that genuinely need
            # to be written get their own writable volumes.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "waitformeet.pvcName" . }}
          {{- else }}
          # Nothing survives a restart in this mode. Only useful for a look around.
          emptyDir: {}
          {{- end }}
        - name: seed
          configMap:
            name: {{ include "waitformeet.fullname" . }}-seed
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
