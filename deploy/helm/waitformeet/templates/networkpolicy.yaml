{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "waitformeet.fullname" . }}
  labels:
    {{- include "waitformeet.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "waitformeet.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS, without which nothing else resolves.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.allowedEgressPorts }}
    # Outbound for OIDC discovery and, if switched on, the weather service.
    - ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
{{- end }}
