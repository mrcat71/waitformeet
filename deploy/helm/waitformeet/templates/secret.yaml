{{- if not .Values.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "waitformeet.fullname" . }}
  labels:
    {{- include "waitformeet.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Generated on first install and preserved across upgrades, so an upgrade does
  # not invalidate every open form and in-flight login.
  {{ .Values.existingSecret.keys.sessionSecret }}: {{ include "waitformeet.sessionSecret" . | quote }}
  {{- with .Values.auth.bootstrap.password }}
  {{ $.Values.existingSecret.keys.bootstrapPassword }}: {{ . | quote }}
  {{- end }}
  {{- if .Values.auth.oidc.enabled }}
  {{ .Values.existingSecret.keys.oidcClientSecret }}: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
