apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "waitformeet.fullname" . }}-test-connection"
  labels:
    {{- include "waitformeet.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.36
      command:
        - wget
      args:
        - --spider
        - --timeout=10
        - "http://{{ include "waitformeet.fullname" . }}:{{ .Values.service.port }}/readyz"
