{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "waitformeet.fullname" . }}
  labels:
    {{- include "waitformeet.labels" . | nindent 4 }}
  {{- if or .Values.persistence.keepOnDelete .Values.persistence.annotations }}
  annotations:
    {{- if .Values.persistence.keepOnDelete }}
    # This volume holds photographs and letters. Losing it to a mistyped
    # `helm uninstall` is not a recoverable kind of mistake.
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
